    * { font-family: 'Inter', system-ui, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(249, 115, 22, 0.3); } 50% { box-shadow: 0 0 30px rgba(249, 115, 22, 0.5); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-slideDown { animation: slideDown 0.4s ease-out forwards; }
    .animate-slideInRight { animation: slideInRight 0.4s ease-out forwards; }
    .animate-scaleIn { animation: scaleIn 0.3s ease-out forwards; }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }
    .animate-shimmer { animation: shimmer 2s linear infinite; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); background-size: 200% 100%; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .animate-bounce { animation: bounce 1s ease-in-out infinite; }
    .animate-spin { animation: spin 1s linear infinite; }

    /* Stagger delays */
    .delay-1 { animation-delay: 0.05s; opacity: 0; }
    .delay-2 { animation-delay: 0.1s; opacity: 0; }
    .delay-3 { animation-delay: 0.15s; opacity: 0; }
    .delay-4 { animation-delay: 0.2s; opacity: 0; }
    .delay-5 { animation-delay: 0.25s; opacity: 0; }
    .delay-6 { animation-delay: 0.3s; opacity: 0; }

    /* Hover effects */
    .hover-lift { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4); }

    .hover-scale { transition: transform 0.2s ease; }
    .hover-scale:hover { transform: scale(1.02); }

    .hover-glow { transition: box-shadow 0.3s ease; }
    .hover-glow:hover { box-shadow: 0 0 30px rgba(249, 115, 22, 0.3); }

    /* Glass effect */
    .glass { background: rgba(16, 42, 67, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .glass-light { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }

    /* Scrollbar */
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Gradient text */
    .text-gradient { background: linear-gradient(135deg, #f97316, #fb923c); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* Button press effect */
    .btn-press:active { transform: scale(0.98); }

    /* Focus ring */
    .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3); }

    /* Decorative dot pattern */
    .dot-pattern {
      background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>

                      key={m.id}
                      onClick={() => m.status === 'in_progress' && setApproveModal({ project, milestone: m })}
                      className={`p-4 rounded-xl border text-center transition-all ${
                        m.status === 'completed'
                          ? 'bg-success-500/10 border-success-500/30'
                          : m.status === 'in_progress'
                            ? 'bg-fire-500/10 border-fire-500/30 hover:border-fire-500 hover:shadow-lg hover:shadow-fire-500/20 cursor-pointer'

                      <div className="text-sm font-medium text-white mb-1">{m.name}</div>

              <Button variant="secondary" icon={Icons.Upload}>Upload Invoice</Button>

          <div className="glass rounded-2xl border border-white/10 p-12 text-center">

              <div className="flex items-center justify-between py-4 border-b border-white/10">

                  <div className="font-medium text-white">Notifications</div>
                  <div className="text-sm text-navy-400">Email and SMS preferences</div>
                </div>
                <Button variant="secondary" size="sm">Configure</Button>
              </div>
              <div className="flex items-center justify-between py-4">
                <div>
                  <div className="font-medium text-white">API Access</div>
                  <div className="text-sm text-navy-400">Manage API keys and webhooks</div>
                </div>
                <Button variant="secondary" size="sm">View Keys</Button>
              </div>
            </div>
          </div>
        </div>

        dashboard: DashboardView,
        projects: ProjectsView,
        contractors: ContractorsView,
        payments: PaymentsView,
        invoices: InvoicesView,
        compliance: ComplianceView,
        settings: SettingsView,

                  <div className="flex items-center gap-3">
                    <img
                      src="https://res.cloudinary.com/dmgkjnefr/image/upload/v1764348601/ChatGPT_Image_Nov_28_2025_11_48_43_AM_kyjj3o.png"
                      alt="PayoutMate"
                      className="w-10 h-10 rounded-xl object-contain"
                    />
                    <div>
                      <div className="font-bold text-white text-lg">PayoutMate</div>
                      <div className="text-xs text-navy-400">Contractor Payments</div>
                    </div>
                  </div>
                </div>

                {/* Navigation */}
                <nav className="flex-1 p-4 space-y-1 overflow-y-auto scrollbar-thin">
                  {navItems.map(item => (
                    <button
                      key={item.id}
                      onClick={() => setView(item.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left ${
                        view === item.id
                          ? 'bg-fire-500/20 text-fire-400'
                          : 'text-navy-300 hover:text-white hover:bg-white/5'
                      }`}
                    >
                      <item.icon />
                      <span className="font-medium">{item.label}</span>
                      {item.id === 'payments' && stats.pending > 0 && (
                        <span className="ml-auto bg-fire-500 text-white text-xs font-bold px-2 py-0.5 rounded-full">{stats.pending}</span>
                      )}
                    </button>
                  ))}
                </nav>

                {/* User */}
                <div className="p-4 border-t border-white/10">
                  <div className="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition-colors cursor-pointer">
                    <Avatar name="John Doe" size="md" />
                    <div className="flex-1 min-w-0">
                      <div className="font-medium text-white text-sm truncate">John Doe</div>
                      <div className="text-xs text-navy-400 truncate">john@company.com</div>
                    </div>
                    <Icons.ChevronRight className="text-navy-400" />
                  </div>
                </div>
              </div>

              {/* Main Content */}
              <div className="flex-1 flex flex-col bg-navy-950/50">
                {/* Header */}
                <div className="px-8 py-5 border-b border-white/10 bg-navy-900/30 backdrop-blur-sm flex items-center justify-between">
                  <div>
                    <h1 className="text-2xl font-bold text-white capitalize">{view === 'dashboard' ? 'Welcome back' : view}</h1>
                    <p className="text-navy-400 text-sm">Manage your contractor payments and compliance</p>
                  </div>
                  <div className="flex items-center gap-4">
                    {/* Search */}
                    <div className="relative">
                      <Icons.Search className="absolute left-3 top-1/2 -translate-y-1/2 text-navy-400 w-4 h-4" />
                      <input
                        type="text"
                        placeholder="Search..."
                        className="pl-9 pr-4 py-2 bg-white/5 border border-white/10 rounded-xl text-white placeholder-navy-400 focus:outline-none focus:border-fire-500 w-48 text-sm"
                      />
                    </div>

                    {/* Notifications */}
                    <div className="relative">
                      <button
                        onClick={() => setShowNotifications(!showNotifications)}

                            <span className="font-semibold text-white">Notifications</span>
                            <Badge>{notifications.length} new</Badge>
                          </div>
                          <div className="max-h-80 overflow-y-auto">
                            {notifications.map(n => (
                              <div key={n.id} className="px-4 py-3 hover:bg-white/5 border-b border-white/5 last:border-0 cursor-pointer">
                                <div className="text-sm text-white">{n.msg}</div>
                                <div className="text-xs text-navy-400 mt-1">{n.time}</div>
                              </div>
                            ))}
                          </div>
                          <div className="px-4 py-3 border-t border-white/10">
                            <Button variant="ghost" size="sm" className="w-full">View all notifications</Button>
                          </div>
                        </div>
                      )}

                      Quick Pay

                </div>

                {/* Content */}

                <select
                  value={payForm.contractor}
                  onChange={e => setPayForm({ ...payForm, contractor: e.target.value })}
                  required
                  className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-fire-500"
                >
                  <option value="" className="bg-navy-900">Select contractor...</option>
                  {contractors.map(c => <option key={c.id} value={c.id} className="bg-navy-900">{c.name} - {c.company}</option>)}

              </div>
              <div>
                <label className="block text-sm font-semibold text-navy-200 mb-2">Amount</label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-navy-400 font-mono">$</span>
                  <input
                    type="number"
                    value={payForm.amount}
                    onChange={e => setPayForm({ ...payForm, amount: e.target.value })}
                    required
                    min="1"
                    className="w-full pl-8 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white font-mono focus:outline-none focus:border-fire-500"
                    placeholder="0.00"
                  />
                </div>
              </div>
              <div>
                <label className="block text-sm font-semibold text-navy-200 mb-2">Description</label>
                <input
                  type="text"
                  value={payForm.desc}
                  onChange={e => setPayForm({ ...payForm, desc: e.target.value })}
                  className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-fire-500"
                  placeholder="Payment for..."
                />
              </div>
              <div>
                <label className="block text-sm font-semibold text-navy-200 mb-3">Payout Speed</label>
                <div className="grid grid-cols-3 gap-3">
                  {[
                    { id: 'standard', label: 'Standard', sub: '5-7 days', fee: 'Free' },
                    { id: 'express', label: 'Express', sub: '24 hours', fee: '$24.99' },
                    { id: 'instant', label: 'Instant', sub: '< 30 sec', fee: '2%' },
                  ].map(opt => (
                    <button
                      key={opt.id}
                      type="button"
                      onClick={() => setPayForm({ ...payForm, speed: opt.id })}
                      className={`p-4 rounded-xl border-2 transition-all text-left ${
                        payForm.speed === opt.id
                          ? 'border-fire-500 bg-fire-500/10'
                          : 'border-white/10 hover:border-white/20'
                      }`}
                    >
                      <div className="font-semibold text-white flex items-center gap-2">
                        {opt.id === 'instant' && <Icons.Zap className="text-fire-400" />}
                        {opt.label}
                      </div>
                      <div className="text-xs text-navy-400 mt-1">{opt.sub}</div>
                      <div className="text-sm font-mono text-fire-400 mt-2">{opt.fee}</div>
                    </button>
                  ))}
                </div>
              </div>
              <div className="pt-4 flex gap-3">
                <Button type="button" variant="secondary" onClick={() => setPayModal(false)} className="flex-1">Cancel</Button>
                <Button type="submit" className="flex-1" icon={Icons.ArrowRight}>Send Payment</Button>
              </div>
            </form>
          </Modal>

          {/* Approve Modal */}
          <Modal open={!!approveModal} onClose={() => setApproveModal(null)} title="Approve Milestone">
            {approveModal && (
              <div className="space-y-6">
                <div className="bg-white/5 rounded-xl p-6 border border-white/10">
                  <div className="text-navy-300 mb-2">{approveModal.project.name}</div>
                  <div className="text-xl font-semibold text-white mb-4">{approveModal.milestone.name}</div>
                  <div className="font-mono text-4xl text-white">${approveModal.milestone.amount.toLocaleString()}</div>
                  <div className="text-sm text-navy-400 mt-2">Will be released from escrow</div>
                </div>
                <div>
                  <label className="block text-sm font-semibold text-navy-200 mb-3">Choose Payout Speed</label>
                  <div className="space-y-3">
                    {[
                      { id: 'standard', label: 'Standard', sub: '5-7 business days', fee: 'Free' },
                      { id: 'express', label: 'Express', sub: '24 hours', fee: '$24.99' },
                      { id: 'instant', label: 'Instant', sub: 'Less than 30 seconds', fee: `$${(approveModal.milestone.amount * 0.02).toFixed(2)} (2%)` },
                    ].map(opt => (
                      <button
                        key={opt.id}
                        onClick={() => handleApprove(opt.id)}
                        className="w-full p-5 rounded-xl border-2 border-white/10 hover:border-fire-500 hover:bg-fire-500/10 transition-all flex items-center justify-between group"
                      >
                        <div className="flex items-center gap-3">
                          {opt.id === 'instant' && <Icons.Zap className="text-fire-400" />}
                          <div className="text-left">
                            <span className="font-semibold text-white">{opt.label}</span>
                            <div className="text-sm text-navy-400">{opt.sub}</div>
                          </div>
                        </div>
                        <span className="font-mono text-fire-400">{opt.fee}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </Modal>

          {/* Detail Modal */}
          <Modal open={!!detailModal} onClose={() => setDetailModal(null)} title={detailModal?.type === 'contractor' ? 'Contractor Details' : detailModal?.type === 'payment' ? 'Payment Details' : 'Project Details'} size="lg">
            {detailModal?.type === 'contractor' && (
              <div className="space-y-6">
                <div className="flex items-center gap-4">
                  <Avatar name={detailModal.data.name} size="lg" />
                  <div>
                    <div className="text-xl font-semibold text-white">{detailModal.data.name}</div>
                    <div className="text-navy-400">{detailModal.data.company}</div>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white/5 rounded-xl p-4">
                    <div className="text-sm text-navy-400 mb-1">Email</div>
                    <div className="text-white font-mono">{detailModal.data.email}</div>
                  </div>
                  <div className="bg-white/5 rounded-xl p-4">
                    <div className="text-sm text-navy-400 mb-1">Total Paid</div>
                    <div className="text-white font-mono text-xl">${detailModal.data.paid.toLocaleString()}</div>
                  </div>
                </div>
                <div className="flex gap-3">
                  <Badge variant={detailModal.data.w9 === 'collected' ? 'success' : 'warning'} size="md">
                    W-9 {detailModal.data.w9 === 'collected' ? 'Collected' : 'Missing'}
                  </Badge>
                  <Badge variant={detailModal.data.tin === 'verified' ? 'success' : 'warning'} size="md">
                    TIN {detailModal.data.tin === 'verified' ? 'Verified' : 'Pending'}
                  </Badge>
                </div>
                <div className="flex gap-3 pt-4">
                  <Button variant="secondary" className="flex-1" icon={Icons.Document}>View W-9</Button>
                  <Button className="flex-1" icon={Icons.Zap} onClick={() => { setDetailModal(null); setPayForm({ ...payForm, contractor: String(detailModal.data.id) }); setPayModal(true); }}>Send Payment</Button>
                </div>
              </div>
            )}
            {detailModal?.type === 'payment' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-4">
                    <Avatar name={detailModal.data.contractor?.name || 'NA'} size="lg" />
                    <div>
                      <div className="text-xl font-semibold text-white">{detailModal.data.contractor?.name}</div>
                      <div className="text-navy-400">{detailModal.data.desc}</div>
                    </div>
                  </div>
                  <Badge variant={detailModal.data.status === 'completed' ? 'success' : detailModal.data.status === 'processing' ? 'warning' : 'info'} size="md">
                    {detailModal.data.status === 'completed' ? '✓ Paid' : detailModal.data.status === 'processing' ? 'Processing' : 'Scheduled'}
                  </Badge>
                </div>
                <div className="bg-white/5 rounded-xl p-6 text-center">
                  <div className="font-mono text-4xl text-white">${detailModal.data.amount.toLocaleString()}</div>
                  <div className="text-navy-400 mt-2">{detailModal.data.date} at {detailModal.data.time}</div>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white/5 rounded-xl p-4">
                    <div className="text-sm text-navy-400 mb-1">Speed</div>
                    <Badge variant={detailModal.data.speed === 'instant' ? 'fire' : detailModal.data.speed === 'express' ? 'warning' : 'default'}>
                      {detailModal.data.speed === 'instant' && <Icons.Zap />}
                      {detailModal.data.speed.charAt(0).toUpperCase() + detailModal.data.speed.slice(1)}
                    </Badge>
                  </div>
                  <div className="bg-white/5 rounded-xl p-4">
                    <div className="text-sm text-navy-400 mb-1">Transaction ID</div>
                    <div className="text-white font-mono text-sm">TXN-{detailModal.data.id}</div>
                  </div>
                </div>
                <div className="flex gap-3 pt-4">
                  <Button variant="secondary" className="flex-1" icon={Icons.Download}>Download Receipt</Button>
                  <Button variant="secondary" className="flex-1" icon={Icons.ExternalLink}>View in Bank</Button>
                </div>
              </div>
            )}
            {detailModal?.type === 'project' && (
              <div className="space-y-6">
                <div className="flex items-center gap-4">
                  <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${verticals[detailModal.data.vertical].color} flex items-center justify-center text-white text-2xl`}>
                    {verticals[detailModal.data.vertical].icon}
                  </div>
                  <div>
                    <div className="text-xl font-semibold text-white">{detailModal.data.name}</div>
                    <div className="text-navy-400">{detailModal.data.client}</div>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-4">
                  <div className="bg-white/5 rounded-xl p-4">
                    <div className="text-sm text-navy-400 mb-1">Budget</div>
                    <div className="text-white font-mono text-xl">${detailModal.data.budget.toLocaleString()}</div>
                  </div>
                  <div className="bg-white/5 rounded-xl p-4">
                    <div className="text-sm text-navy-400 mb-1">Spent</div>
                    <div className="text-white font-mono text-xl">${detailModal.data.spent.toLocaleString()}</div>
                  </div>
                  <div className="bg-white/5 rounded-xl p-4">
                    <div className="text-sm text-navy-400 mb-1">In Escrow</div>
                    <div className="text-success-400 font-mono text-xl">${(detailModal.data.funded - detailModal.data.spent).toLocaleString()}</div>
                  </div>
                </div>
                <div>
                  <div className="text-sm font-semibold text-navy-200 mb-3">Milestones</div>
                  <div className="space-y-2">
                    {detailModal.data.milestones.map(m => (
                      <div key={m.id} className="flex items-center justify-between p-3 bg-white/5 rounded-xl">
                        <div className="flex items-center gap-3">
                          <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${m.status === 'completed' ? 'bg-success-500/20 text-success-400' : m.status === 'in_progress' ? 'bg-fire-500/20 text-fire-400' : 'bg-white/10 text-navy-400'}`}>
                            {m.status === 'completed' ? '✓' : m.status === 'in_progress' ? '●' : '○'}
                          </div>
                          <span className="text-white">{m.name}</span>
                        </div>
                        <span className="font-mono text-white">${m.amount.toLocaleString()}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </Modal>

          {/* Toasts */}
          <div className="fixed bottom-6 right-6 space-y-3 z-50">
            {toasts.map(t => <Toast key={t.id} msg={t.msg} type={t.type} onClose={() => setToasts(prev => prev.filter(x => x.id !== t.id))} />)}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<PayoutDashboard />);
  </script>
</body>
</html>
