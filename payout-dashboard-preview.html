      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={onClose} />
          <div className={`relative bg-white rounded-2xl shadow-2xl w-full ${sizes[size]} max-h-[90vh] overflow-hidden animate-slide-up`}>
            <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100">
              <h2 className="text-lg font-bold text-gray-900">{title}</h2>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-xl transition-colors"><Icons.x className="w-5 h-5 text-gray-500" /></button>
            </div>
            <div className="p-6 overflow-y-auto max-h-[calc(90vh-80px)] scrollbar-thin">{children}</div>

        </div>
      );

                  <div className="flex items-center space-x-3">
                    <div className="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center"><Icons.file className="w-6 h-6 text-gray-400" /></div>
                    <div>
                      <div className="font-medium text-gray-900">{invoice.ocrData?.vendor || invoice.contractor}</div>
                      <div className="text-sm text-gray-500">Uploaded {invoice.date}</div>
                    </div>
                  </div>
                  <Badge variant={invoice.status === 'approved' ? 'success' : invoice.status === 'pending_review' ? 'warning' : 'default'}>
                    {invoice.status === 'approved' ? '✓ Approved' : '● Review'}
                  </Badge>
                </div>
                <div className="bg-gray-50 rounded-lg p-4 mb-4">
                  <div className="grid grid-cols-2 gap-4 text-sm">
                    <div><span className="text-gray-500">Amount:</span> <span className="font-bold text-gray-900">${invoice.ocrData?.amount?.toLocaleString()}</span></div>
                    <div><span className="text-gray-500">Terms:</span> <span className="font-medium text-gray-900">{invoice.ocrData?.terms}</span></div>
                    <div><span className="text-gray-500">Invoice Date:</span> <span className="text-gray-900">{invoice.ocrData?.date}</span></div>
                  </div>
                </div>
                <div className="flex space-x-2">
                  {invoice.status === 'pending_review' && (
                    <>
                      <button onClick={() => { setInvoices(prev => prev.map(i => i.id === invoice.id ? { ...i, status: 'approved' } : i)); addToast('Invoice approved'); }} className="flex-1 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">Approve & Pay</button>
                      <button className="px-4 py-2 border border-gray-200 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">Edit</button>
                    </>
                  )}
                  {invoice.status === 'approved' && <button className="flex-1 px-4 py-2 bg-emerald-600 text-white text-sm font-medium rounded-lg">✓ Paid</button>}
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      const ComplianceView = () => (
        <div className="space-y-6 animate-fade-in">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <StatCard label="W-9s Collected" value={`${stats.w9Collected}/${stats.totalContractors}`} icon={Icons.file} color="emerald" />
            <StatCard label="TINs Verified" value={`${stats.tinVerified}/${stats.totalContractors}`} icon={Icons.check} color="blue" />
            <StatCard label="1099s to File" value={contractors.filter(c => c.totalPaid >= 600).length} icon={Icons.mail} subValue="≥$600 paid" color="purple" />
          </div>

          <div className="bg-white rounded-xl border border-gray-100 shadow-sm">
            <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
              <h3 className="font-bold text-gray-900">1099 Preparation Status</h3>
              <button className="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700 transition-colors">Generate 1099s</button>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full">
                <thead className="bg-gray-50 border-b border-gray-100">
                  <tr>
                    <th className="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Contractor</th>
                    <th className="px-5 py-3 text-right text-xs font-semibold text-gray-500 uppercase">YTD Payments</th>
                    <th className="px-5 py-3 text-center text-xs font-semibold text-gray-500 uppercase">W-9</th>
                    <th className="px-5 py-3 text-center text-xs font-semibold text-gray-500 uppercase">TIN Match</th>
                    <th className="px-5 py-3 text-center text-xs font-semibold text-gray-500 uppercase">1099 Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {contractors.filter(c => c.totalPaid >= 600).map(contractor => (
                    <tr key={contractor.id} className="hover:bg-gray-50">
                      <td className="px-5 py-4">
                        <div className="flex items-center space-x-3">
                          <div className={`w-9 h-9 rounded-lg ${contractor.avatar} flex items-center justify-center text-white text-xs font-bold`}>{contractor.initials}</div>
                          <div>
                            <div className="font-medium text-gray-900">{contractor.name}</div>
                            <div className="text-sm text-gray-500">{contractor.company}</div>
                          </div>
                        </div>
                      </td>
                      <td className="px-5 py-4 text-right font-bold text-gray-900">${contractor.totalPaid.toLocaleString()}</td>
                      <td className="px-5 py-4 text-center"><Badge variant={contractor.w9 === 'collected' ? 'success' : 'warning'}>{contractor.w9 === 'collected' ? '✓' : '●'}</Badge></td>
                      <td className="px-5 py-4 text-center"><Badge variant={contractor.tinMatch === 'verified' ? 'success' : 'warning'}>{contractor.tinMatch === 'verified' ? '✓' : '●'}</Badge></td>
                      <td className="px-5 py-4 text-center"><Badge variant={contractor.w9 === 'collected' && contractor.tinMatch === 'verified' ? 'success' : 'warning'}>{contractor.w9 === 'collected' && contractor.tinMatch === 'verified' ? 'Ready' : 'Incomplete'}</Badge></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );

      const SettingsView = () => (
        <div className="space-y-6 animate-fade-in">
          <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
            <h3 className="font-bold text-gray-900 mb-4">Company Information</h3>
            <div className="grid grid-cols-2 gap-4">
              <div><label className="block text-sm font-medium text-gray-700 mb-1">Company Name</label><input type="text" defaultValue="Acme Agency LLC" className="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" /></div>
              <div><label className="block text-sm font-medium text-gray-700 mb-1">EIN</label><input type="text" defaultValue="XX-XXXXXXX" className="w-full px-4 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" /></div>
            </div>
          </div>
          <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
            <h3 className="font-bold text-gray-900 mb-4">Payment Settings</h3>
            <div className="space-y-4">
              <div className="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                <div><div className="font-medium text-gray-900">Default Payout Speed</div><div className="text-sm text-gray-500">Standard (7-day) — Free</div></div>
                <select className="px-4 py-2 border border-gray-200 rounded-xl text-sm"><option>Standard (Free)</option><option>Express ($24.99)</option><option>Instant (2%)</option></select>
              </div>
              <div className="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                <div><div className="font-medium text-gray-900">Bank Account</div><div className="text-sm text-gray-500">Chase ****4521</div></div>
                <button className="px-4 py-2 border border-gray-200 text-gray-700 text-sm font-medium rounded-xl hover:bg-gray-100">Change</button>
              </div>
            </div>
          </div>
          <div className="bg-white rounded-xl border border-gray-100 shadow-sm p-6">
            <h3 className="font-bold text-gray-900 mb-4">Integrations</h3>
            <div className="space-y-3">
              <div className="flex items-center justify-between p-4 border border-gray-200 rounded-xl">
                <div className="flex items-center space-x-3"><div className="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center text-green-600 font-bold text-sm">QB</div><div><div className="font-medium text-gray-900">QuickBooks Online</div><div className="text-sm text-gray-500">Real-time sync enabled</div></div></div>
                <Badge variant="success">Connected</Badge>
              </div>
              <div className="flex items-center justify-between p-4 border border-gray-200 rounded-xl">
                <div className="flex items-center space-x-3"><div className="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600 font-bold text-sm">DS</div><div><div className="font-medium text-gray-900">DocuSign</div><div className="text-sm text-gray-500">E-signature for contracts</div></div></div>
                <button className="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700">Connect</button>
              </div>
            </div>
          </div>
        </div>
      );

      const views = { dashboard: DashboardView, projects: ProjectsView, contractors: ContractorsView, payments: PaymentsView, invoices: InvoicesView, compliance: ComplianceView, settings: SettingsView };
      const CurrentView = views[activeView];

      return (
        <div className="relative w-full max-w-7xl mx-auto rounded-2xl overflow-hidden bg-gray-50 shadow-2xl shadow-black/25">
          <div className="flex h-[700px]">
            {/* Sidebar */}
            <div className="w-16 bg-white border-r border-gray-100 flex flex-col items-center py-4">
              <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-6">
                <svg viewBox="0 0 24 24" className="w-6 h-6 text-white" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              </div>
              <nav className="flex flex-col items-center space-y-1 flex-1">
                {navItems.map(item => (
                  <button key={item.id} onClick={() => setActiveView(item.id)} className={`w-11 h-11 rounded-xl flex items-center justify-center transition-all group relative ${activeView === item.id ? 'bg-blue-50' : 'hover:bg-gray-50'}`} title={item.label}>
                    <item.icon className={`w-5 h-5 ${activeView === item.id ? 'text-blue-600' : 'text-gray-400 group-hover:text-gray-600'}`} />
                    {activeView === item.id && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-blue-600 rounded-r-full" />}
                  </button>
                ))}
              </nav>
              <div className="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white text-xs font-semibold shadow-lg">JD</div>
            </div>

            {/* Main Content */}
            <div className="flex-1 flex flex-col overflow-hidden">
              <div className="bg-white border-b border-gray-100 px-6 py-4">
                <div className="flex items-center justify-between">
                  <div>
                    <h1 className="text-xl font-bold text-gray-900 capitalize">{activeView}</h1>
                    <p className="text-sm text-gray-500">Contractor payments & compliance</p>
                  </div>
                  <div className="flex items-center space-x-3">
                    {activeView === 'dashboard' && <button onClick={() => setShowPayModal(true)} className="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-blue-700 text-white text-sm font-semibold rounded-xl hover:from-blue-700 hover:to-blue-800 shadow-lg shadow-blue-500/30 flex items-center space-x-2"><Icons.plus className="w-4 h-4" /><span>Pay Contractor</span></button>}
                  </div>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-6 scrollbar-thin"><CurrentView /></div>
            </div>
          </div>

          {/* Modals */}
          <Modal isOpen={showPayModal} onClose={() => setShowPayModal(false)} title="Pay Contractor">
            <form onSubmit={handlePay} className="space-y-4">
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Contractor</label>
                <select value={payForm.contractorId} onChange={e => setPayForm({ ...payForm, contractorId: e.target.value })} required className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                  <option value="">Select contractor...</option>{contractors.map(c => <option key={c.id} value={c.id}>{c.name} — {c.email}</option>)}
                </select>
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Amount (USD)</label>
                <div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">$</span>
                  <input type="number" value={payForm.amount} onChange={e => setPayForm({ ...payForm, amount: e.target.value })} required min="1" step="0.01" className="w-full pl-8 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00" />
                </div>
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <input type="text" value={payForm.milestone} onChange={e => setPayForm({ ...payForm, milestone: e.target.value })} className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Invoice #123 or milestone name" />
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Payout Speed</label>
                <div className="grid grid-cols-3 gap-3">
                  {[{ id: 'standard', label: 'Standard', sub: '7 days • Free' }, { id: 'express', label: 'Express', sub: '24 hrs • $24.99' }, { id: 'instant', label: 'Instant', sub: '< 30 sec • 2%' }].map(opt => (
                    <button key={opt.id} type="button" onClick={() => setPayForm({ ...payForm, speed: opt.id })} className={`px-4 py-3 rounded-xl border-2 transition-all text-left ${payForm.speed === opt.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-gray-300'}`}>
                      <div className="text-sm font-medium text-gray-900">{opt.label}</div><div className="text-xs text-gray-500">{opt.sub}</div>
                    </button>
                  ))}
                </div>
              </div>
              <div className="pt-4 flex space-x-3">
                <button type="button" onClick={() => setShowPayModal(false)} className="flex-1 px-4 py-2.5 border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 font-medium">Cancel</button>
                <button type="submit" className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium shadow-lg shadow-blue-500/30">Send Payment</button>
              </div>
            </form>
          </Modal>

          <Modal isOpen={showProjectModal} onClose={() => setShowProjectModal(false)} title="Create Project">
            <form onSubmit={handleCreateProject} className="space-y-4">
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Project Name</label>
                <input type="text" value={projectForm.name} onChange={e => setProjectForm({ ...projectForm, name: e.target.value })} required className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Website Redesign" />
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Client</label>
                <input type="text" value={projectForm.client} onChange={e => setProjectForm({ ...projectForm, client: e.target.value })} required className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Acme Corp" />
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Vertical Template</label>
                <div className="grid grid-cols-2 gap-3">
                  {Object.entries(verticalTemplates).map(([key, val]) => (
                    <button key={key} type="button" onClick={() => setProjectForm({ ...projectForm, vertical: key })} className={`p-4 rounded-xl border-2 text-left transition-all ${projectForm.vertical === key ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-gray-300'}`}>
                      <div className="text-2xl mb-1">{val.icon}</div><div className="text-sm font-medium text-gray-900">{val.name}</div><div className="text-xs text-gray-500">{val.stages.length} stages</div>
                    </button>
                  ))}
                </div>
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Total Budget (USD)</label>
                <div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">$</span>
                  <input type="number" value={projectForm.budget} onChange={e => setProjectForm({ ...projectForm, budget: e.target.value })} required min="100" className="w-full pl-8 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="10000" />
                </div>
              </div>
              <div className="pt-4 flex space-x-3">
                <button type="button" onClick={() => setShowProjectModal(false)} className="flex-1 px-4 py-2.5 border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 font-medium">Cancel</button>
                <button type="submit" className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium">Create Project</button>
              </div>
            </form>
          </Modal>

          <Modal isOpen={showContractorModal} onClose={() => setShowContractorModal(false)} title="Add Contractor">
            <form onSubmit={handleAddContractor} className="space-y-4">
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Full Name / Business Name</label>
                <input type="text" value={contractorForm.name} onChange={e => setContractorForm({ ...contractorForm, name: e.target.value })} required className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Sarah Mitchell" />
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input type="email" value={contractorForm.email} onChange={e => setContractorForm({ ...contractorForm, email: e.target.value })} required className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="sarah@example.com" />
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Company (optional)</label>
                <input type="text" value={contractorForm.company} onChange={e => setContractorForm({ ...contractorForm, company: e.target.value })} className="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Mitchell Design Co" />
              </div>
              <div><label className="block text-sm font-medium text-gray-700 mb-2">Type</label>
                <div className="grid grid-cols-2 gap-3">
                  {['Individual', 'Business'].map(type => (
                    <button key={type} type="button" onClick={() => setContractorForm({ ...contractorForm, type })} className={`px-4 py-3 rounded-xl border-2 transition-all ${contractorForm.type === type ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-gray-300'}`}>
                      <div className="text-sm font-medium text-gray-900">{type}</div><div className="text-xs text-gray-500">{type === 'Individual' ? 'W-9 required' : 'W-9 required'}</div>
                    </button>
                  ))}
                </div>
              </div>
              <div className="bg-blue-50 rounded-xl p-4 text-sm text-blue-800">
                <strong>W-9 Request:</strong> A W-9 form request will be sent automatically to collect tax information.
              </div>
              <div className="pt-4 flex space-x-3">
                <button type="button" onClick={() => setShowContractorModal(false)} className="flex-1 px-4 py-2.5 border border-gray-200 text-gray-700 rounded-xl hover:bg-gray-50 font-medium">Cancel</button>
                <button type="submit" className="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium">Add & Send W-9</button>
              </div>
            </form>
          </Modal>

          <Modal isOpen={showInvoiceModal} onClose={() => setShowInvoiceModal(false)} title="Upload External Invoice">
            <div className="space-y-4">
              <div className="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-400 transition-colors cursor-pointer" onClick={handleUploadInvoice}>
                <Icons.upload className="w-12 h-12 text-gray-400 mx-auto mb-4" />
                <p className="font-medium text-gray-900">Drop invoice here or click to upload</p>
                <p className="text-sm text-gray-500 mt-1">PDF, PNG, JPG up to 10MB</p>
              </div>
              <div className="bg-gray-50 rounded-xl p-4 text-sm text-gray-600">
                <strong>OCR Processing:</strong> We'll automatically extract vendor, amount, date, and terms from your invoice.
              </div>
            </div>
          </Modal>

          <Modal isOpen={!!showMilestoneApproval} onClose={() => setShowMilestoneApproval(null)} title="Approve Milestone & Pay">
            {showMilestoneApproval && (
              <div className="space-y-4">
                <div className="bg-gray-50 rounded-xl p-4">
                  <div className="font-medium text-gray-900 mb-1">{showMilestoneApproval.milestone.name}</div>
                  <div className="text-2xl font-bold text-gray-900">${showMilestoneApproval.milestone.amount.toLocaleString()}</div>
                </div>
                <div><label className="block text-sm font-medium text-gray-700 mb-2">Select Payout Speed</label>
                  <div className="space-y-2">
                    {[{ id: 'standard', label: 'Standard (7 days)', sub: 'Free — ACH transfer', fee: '$0' }, { id: 'express', label: 'Express (24 hours)', sub: 'Priority processing', fee: '$24.99' }, { id: 'instant', label: 'Instant (< 30 sec)', sub: 'Same-day payout', fee: `$${(showMilestoneApproval.milestone.amount * 0.02).toFixed(2)} (2%)` }].map(opt => (
                      <button key={opt.id} onClick={() => handleApproveMilestone(showMilestoneApproval.projectId, showMilestoneApproval.milestone.id, opt.id)} className="w-full p-4 rounded-xl border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-left flex items-center justify-between">
                        <div><div className="font-medium text-gray-900">{opt.label}</div><div className="text-sm text-gray-500">{opt.sub}</div></div>
                        <div className="text-right"><div className="font-bold text-gray-900">{opt.fee}</div></div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </Modal>

          {/* Toasts */}
          <div className="absolute bottom-4 right-4 space-y-2 z-50">
            {toasts.map(toast => <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => removeToast(toast.id)} />)}
          </div>

          {/* Compliance Badge */}
          <div className="absolute top-4 right-4">
            <div className="bg-white/95 backdrop-blur-sm rounded-xl shadow-lg border border-gray-100 px-3 py-2 flex items-center space-x-2">
              <div className="w-5 h-5 bg-emerald-100 rounded-full flex items-center justify-center"><Icons.check className="w-3 h-3 text-emerald-600" /></div>
              <span className="text-xs font-semibold text-gray-700">{stats.w9Collected}/{stats.totalContractors} W-9s</span>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<PayoutDashboard />);
  </script>
</body>
