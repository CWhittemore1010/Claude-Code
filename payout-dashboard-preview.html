<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayoutMate — Contractor Payments & Compliance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Instrument Serif', 'Georgia', 'serif'],
            body: ['DM Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            ink: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
            electric: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' },
            mint: { 400: '#34d399', 500: '#10b981', 600: '#059669' },
            coral: { 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48' },
            gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gradient-mesh: radial-gradient(at 40% 20%, hsla(199,89%,48%,0.15) 0px, transparent 50%),
                       radial-gradient(at 80% 0%, hsla(158,64%,52%,0.1) 0px, transparent 50%),
                       radial-gradient(at 0% 50%, hsla(355,78%,60%,0.08) 0px, transparent 50%),
                       radial-gradient(at 80% 50%, hsla(42,96%,56%,0.08) 0px, transparent 50%),
                       radial-gradient(at 0% 100%, hsla(199,89%,48%,0.1) 0px, transparent 50%);
      --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
    * { font-family: 'DM Sans', system-ui, sans-serif; }
    .font-display { font-family: 'Instrument Serif', Georgia, serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes gradient-shift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(14, 165, 233, 0.3); } 50% { box-shadow: 0 0 40px rgba(14, 165, 233, 0.5); } }

    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-pulse-ring { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .animate-gradient { animation: gradient-shift 8s ease infinite; background-size: 200% 200%; }
    .animate-slide-up { animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    .animate-shimmer { animation: shimmer 2s linear infinite; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); background-size: 200% 100%; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }

    .noise-overlay::before { content: ''; position: absolute; inset: 0; background-image: var(--noise); opacity: 0.03; pointer-events: none; mix-blend-mode: overlay; }
    .mesh-bg { background-image: var(--gradient-mesh); }

    .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .glass-dark { background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

    .scrollbar-hidden::-webkit-scrollbar { display: none; }
    .scrollbar-hidden { -ms-overflow-style: none; scrollbar-width: none; }

    .text-gradient { background: linear-gradient(135deg, #0ea5e9, #10b981, #0ea5e9); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% auto; animation: gradient-shift 4s ease infinite; }

    .border-gradient { border: 2px solid transparent; background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #0ea5e9, #10b981) border-box; }

    .hover-lift { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease; }
    .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }

    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.1s; }
    .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.2s; }
    .stagger-5 { animation-delay: 0.25s; }
  </style>
</head>
<body class="min-h-screen bg-ink-950 flex items-center justify-center p-4 md:p-8">
  <!-- Ambient background -->
  <div class="fixed inset-0 mesh-bg opacity-50"></div>
  <div class="fixed inset-0 noise-overlay"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // Data
    const initialProjects = [
      { id: 1, name: 'Website Redesign', client: 'Acme Corp', vertical: 'software', budget: 15000, funded: 15000, spent: 8200, status: 'active', milestones: [
        { id: 'm1', name: 'Discovery', amount: 3000, status: 'completed', contractor: 1 },
        { id: 'm2', name: 'Design', amount: 4000, status: 'completed', contractor: 1 },
        { id: 'm3', name: 'Development', amount: 5000, status: 'in_progress', contractor: 2 },
        { id: 'm4', name: 'Launch', amount: 3000, status: 'pending', contractor: 2 },
      ]},
      { id: 2, name: 'Q1 Campaign', client: 'StyleBrand', vertical: 'ecommerce', budget: 25000, funded: 25000, spent: 12400, status: 'active', milestones: [
        { id: 'm5', name: 'Brief', amount: 2000, status: 'completed', contractor: 3 },
        { id: 'm6', name: 'Content', amount: 15000, status: 'in_progress', contractor: 4 },
        { id: 'm7', name: 'Launch', amount: 8000, status: 'pending', contractor: 3 },
      ]},
      { id: 3, name: 'Kitchen Reno', client: '123 Oak St', vertical: 'construction', budget: 45000, funded: 30000, spent: 22000, status: 'active', milestones: [
        { id: 'm8', name: 'Demo', amount: 8000, status: 'completed', contractor: 5 },
        { id: 'm9', name: 'Plumbing', amount: 6000, status: 'completed', contractor: 6 },
        { id: 'm10', name: 'Cabinets', amount: 15000, status: 'in_progress', contractor: 5 },
        { id: 'm11', name: 'Finish', amount: 16000, status: 'pending', contractor: 5 },
      ]},
    ];

    const initialContractors = [
      { id: 1, name: 'Sarah Mitchell', email: 'sarah@design.co', company: 'Mitchell Design', w9: 'collected', tin: 'verified', paid: 7000, color: 'from-electric-400 to-electric-600' },
      { id: 2, name: 'DevStudio LLC', email: 'dev@studio.io', company: 'DevStudio', w9: 'collected', tin: 'verified', paid: 1200, color: 'from-mint-400 to-mint-600' },
      { id: 3, name: 'Maria Garcia', email: 'maria@creative.co', company: 'Garcia Creative', w9: 'collected', tin: 'verified', paid: 4400, color: 'from-coral-400 to-coral-600' },
      { id: 4, name: 'James Chen', email: 'james@content.co', company: 'Chen Media', w9: 'collected', tin: 'pending', paid: 8000, color: 'from-gold-400 to-gold-600' },
      { id: 5, name: 'BuildRight Inc', email: 'ap@buildright.com', company: 'BuildRight', w9: 'collected', tin: 'verified', paid: 19000, color: 'from-electric-400 to-mint-500' },
      { id: 6, name: 'Mike Plumbing', email: 'mike@plumb.com', company: "Mike's Plumbing", w9: 'collected', tin: 'verified', paid: 6000, color: 'from-mint-400 to-electric-500' },
    ];

    const initialPayments = [
      { id: 1, contractor: 1, amount: 4000, desc: 'UI Design', speed: 'instant', status: 'completed', date: 'Jan 15' },
      { id: 2, contractor: 5, amount: 8000, desc: 'Demo & Prep', speed: 'standard', status: 'completed', date: 'Jan 12' },
      { id: 3, contractor: 6, amount: 6000, desc: 'Plumbing', speed: 'instant', status: 'completed', date: 'Jan 10' },
      { id: 4, contractor: 3, amount: 2400, desc: 'Content Brief', speed: 'express', status: 'processing', date: 'Jan 18' },
      { id: 5, contractor: 2, amount: 2500, desc: 'Frontend Dev', speed: 'standard', status: 'scheduled', date: 'Jan 25' },
    ];

    const verticals = {
      software: { icon: '◈', name: 'Software', gradient: 'from-electric-400 to-electric-600' },
      ecommerce: { icon: '◉', name: 'E-Commerce', gradient: 'from-coral-400 to-coral-600' },
      construction: { icon: '▣', name: 'Construction', gradient: 'from-gold-400 to-gold-600' },
      creative: { icon: '◐', name: 'Creative', gradient: 'from-mint-400 to-mint-600' },
    };

    // Components
    const Modal = ({ open, onClose, title, children }) => {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-ink-950/80 backdrop-blur-sm" onClick={onClose} />
          <div className="relative glass rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-slide-up border border-ink-200/50">
            <div className="px-8 py-6 border-b border-ink-200/50">
              <h2 className="font-display text-2xl text-ink-900">{title}</h2>
            </div>
            <div className="p-8">{children}</div>
          </div>
        </div>
      );
    };

    const Toast = ({ msg, onClose }) => {
      useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, [onClose]);
      return (
        <div className="glass-dark text-white rounded-2xl px-6 py-4 flex items-center gap-4 animate-slide-up border border-ink-700/50">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-mint-400 to-mint-600 flex items-center justify-center text-white font-bold">✓</div>
          <span className="font-medium">{msg}</span>
        </div>
      );
    };

    // Main App
    const PayoutDashboard = () => {
      const [view, setView] = useState('dashboard');
      const [projects, setProjects] = useState(initialProjects);
      const [contractors] = useState(initialContractors);
      const [payments, setPayments] = useState(initialPayments);
      const [toasts, setToasts] = useState([]);
      const [payModal, setPayModal] = useState(false);
      const [approveModal, setApproveModal] = useState(null);
      const [payForm, setPayForm] = useState({ contractor: '', amount: '', desc: '', speed: 'standard' });

      const addToast = useCallback((msg) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg }]);
      }, []);

      const stats = useMemo(() => ({
        paid: payments.filter(p => p.status === 'completed').reduce((s, p) => s + p.amount, 0),
        escrow: projects.reduce((s, p) => s + (p.funded - p.spent), 0),
        pending: projects.flatMap(p => p.milestones).filter(m => m.status === 'in_progress').length,
        w9: contractors.filter(c => c.w9 === 'collected').length,
      }), [payments, projects, contractors]);

      const handlePay = (e) => {
        e.preventDefault();
        const c = contractors.find(x => x.id === parseInt(payForm.contractor));
        const amt = parseFloat(payForm.amount);
        setPayments(prev => [{ id: Date.now(), contractor: c.id, amount: amt, desc: payForm.desc || 'Payment', speed: payForm.speed, status: payForm.speed === 'instant' ? 'processing' : 'scheduled', date: 'Today' }, ...prev]);
        setPayModal(false);
        setPayForm({ contractor: '', amount: '', desc: '', speed: 'standard' });
        addToast(`$${amt.toLocaleString()} initiated to ${c.name}`);
        if (payForm.speed === 'instant') {
          setTimeout(() => {
            setPayments(prev => prev.map(p => p.id === prev[0].id ? { ...p, status: 'completed' } : p));
            addToast(`$${amt.toLocaleString()} sent instantly!`);
          }, 2000);
        }
      };

      const handleApprove = (speed) => {
        const { project, milestone } = approveModal;
        const c = contractors.find(x => x.id === milestone.contractor);
        setProjects(prev => prev.map(p => p.id === project.id ? {
          ...p, spent: p.spent + milestone.amount,
          milestones: p.milestones.map(m => m.id === milestone.id ? { ...m, status: 'completed' } : m)
        } : p));
        setPayments(prev => [{ id: Date.now(), contractor: milestone.contractor, amount: milestone.amount, desc: milestone.name, speed, status: speed === 'instant' ? 'processing' : 'scheduled', date: 'Today' }, ...prev]);
        setApproveModal(null);
        addToast(`${milestone.name} approved — $${milestone.amount.toLocaleString()} to ${c?.name}`);
        if (speed === 'instant') {
          setTimeout(() => {
            setPayments(prev => prev.map((p, i) => i === 0 ? { ...p, status: 'completed' } : p));
            addToast(`Instant payout complete!`);
          }, 2000);
        }
      };

      const navItems = [
        { id: 'dashboard', icon: '⌂', label: 'Home' },
        { id: 'projects', icon: '◧', label: 'Projects' },
        { id: 'contractors', icon: '◎', label: 'Contractors' },
        { id: 'payments', icon: '◈', label: 'Payments' },
        { id: 'compliance', icon: '◉', label: 'Compliance' },
      ];

      const DashboardView = () => (
        <div className="space-y-8">
          {/* Hero Stats */}
          <div className="grid grid-cols-4 gap-4">
            {[
              { label: 'Paid This Month', value: `$${stats.paid.toLocaleString()}`, sub: '+12% from last month', gradient: 'from-electric-400 to-electric-600', delay: 'stagger-1' },
              { label: 'In Escrow', value: `$${stats.escrow.toLocaleString()}`, sub: 'Protected funds', gradient: 'from-mint-400 to-mint-600', delay: 'stagger-2' },
              { label: 'Pending Approval', value: stats.pending, sub: 'Milestones ready', gradient: 'from-gold-400 to-gold-600', delay: 'stagger-3' },
              { label: '1099 Ready', value: `${stats.w9}/${contractors.length}`, sub: 'W-9s collected', gradient: 'from-coral-400 to-coral-600', delay: 'stagger-4' },
            ].map((stat, i) => (
              <div key={i} className={`glass rounded-2xl p-6 hover-lift border border-ink-200/50 animate-slide-up opacity-0 ${stat.delay}`}>
                <div className="flex items-start justify-between mb-4">
                  <span className="text-xs font-semibold text-ink-500 uppercase tracking-wider">{stat.label}</span>
                  <div className={`w-8 h-8 rounded-lg bg-gradient-to-br ${stat.gradient} opacity-20`} />
                </div>
                <div className="font-display text-4xl text-ink-900 mb-1">{stat.value}</div>
                <div className="text-sm text-ink-500">{stat.sub}</div>
              </div>
            ))}
          </div>

          {/* Projects + Payments Grid */}
          <div className="grid grid-cols-5 gap-6">
            {/* Active Projects */}
            <div className="col-span-3 glass rounded-2xl border border-ink-200/50 overflow-hidden animate-slide-up opacity-0 stagger-2">
              <div className="px-6 py-5 border-b border-ink-200/50 flex items-center justify-between">
                <h3 className="font-display text-xl text-ink-900">Active Projects</h3>
                <span className="text-xs font-mono text-ink-400">{projects.length} total</span>
              </div>
              <div className="divide-y divide-ink-100">
                {projects.map((project, i) => (
                  <div key={project.id} className="px-6 py-5 hover:bg-ink-50/50 cursor-pointer transition-colors group">
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-3">
                        <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${verticals[project.vertical].gradient} flex items-center justify-center text-white text-lg font-display`}>
                          {verticals[project.vertical].icon}
                        </div>
                        <div>
                          <div className="font-semibold text-ink-900 group-hover:text-electric-600 transition-colors">{project.name}</div>
                          <div className="text-sm text-ink-500">{project.client}</div>
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="font-mono text-lg text-ink-900">${project.spent.toLocaleString()}</div>
                        <div className="text-xs text-ink-400">of ${project.budget.toLocaleString()}</div>
                      </div>
                    </div>
                    <div className="h-2 bg-ink-100 rounded-full overflow-hidden">
                      <div className={`h-full bg-gradient-to-r ${verticals[project.vertical].gradient} rounded-full transition-all duration-1000`} style={{ width: `${(project.spent / project.budget) * 100}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Recent Payments */}
            <div className="col-span-2 glass rounded-2xl border border-ink-200/50 overflow-hidden animate-slide-up opacity-0 stagger-3">
              <div className="px-6 py-5 border-b border-ink-200/50">
                <h3 className="font-display text-xl text-ink-900">Recent Payments</h3>
              </div>
              <div className="divide-y divide-ink-100">
                {payments.slice(0, 5).map(payment => {
                  const c = contractors.find(x => x.id === payment.contractor);
                  return (
                    <div key={payment.id} className="px-6 py-4 flex items-center justify-between hover:bg-ink-50/50 transition-colors">
                      <div className="flex items-center gap-3">
                        <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${c?.color} flex items-center justify-center text-white text-xs font-bold`}>
                          {c?.name.split(' ').map(n => n[0]).join('')}
                        </div>
                        <div>
                          <div className="font-medium text-ink-900 text-sm">{c?.name}</div>
                          <div className="text-xs text-ink-400">{payment.desc}</div>
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="font-mono font-semibold text-ink-900">${payment.amount.toLocaleString()}</div>
                        <div className={`text-xs font-medium ${payment.status === 'completed' ? 'text-mint-600' : payment.status === 'processing' ? 'text-gold-600' : 'text-ink-400'}`}>
                          {payment.status === 'completed' ? '✓ Paid' : payment.status === 'processing' ? '● Processing' : '○ Scheduled'}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Milestones Awaiting */}
          <div className="glass rounded-2xl border border-ink-200/50 overflow-hidden animate-slide-up opacity-0 stagger-4">
            <div className="px-6 py-5 border-b border-ink-200/50">
              <h3 className="font-display text-xl text-ink-900">Milestones Awaiting Approval</h3>
            </div>
            <div className="divide-y divide-ink-100">
              {projects.flatMap(p => p.milestones.filter(m => m.status === 'in_progress').map(m => ({ ...m, project: p }))).map(milestone => {
                const c = contractors.find(x => x.id === milestone.contractor);
                return (
                  <div key={milestone.id} className="px-6 py-5 flex items-center justify-between hover:bg-ink-50/50 transition-colors">
                    <div className="flex items-center gap-4">
                      <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${c?.color} flex items-center justify-center text-white font-bold`}>
                        {c?.name.split(' ').map(n => n[0]).join('')}
                      </div>
                      <div>
                        <div className="font-semibold text-ink-900">{milestone.name}</div>
                        <div className="text-sm text-ink-500">{milestone.project.name} · {c?.name}</div>
                      </div>
                    </div>
                    <div className="flex items-center gap-6">
                      <div className="font-display text-2xl text-ink-900">${milestone.amount.toLocaleString()}</div>
                      <button onClick={() => setApproveModal({ project: milestone.project, milestone })} className="px-6 py-3 bg-gradient-to-r from-electric-500 to-mint-500 text-white font-semibold rounded-xl hover:shadow-lg hover:shadow-electric-500/25 transition-all hover:-translate-y-0.5">
                        Approve & Pay
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );

      const ContractorsView = () => (
        <div className="space-y-6 animate-fade-in">
          <div className="grid grid-cols-3 gap-4">
            {contractors.map((c, i) => (
              <div key={c.id} className={`glass rounded-2xl p-6 hover-lift border border-ink-200/50 animate-slide-up opacity-0 stagger-${i + 1}`}>
                <div className="flex items-start gap-4 mb-4">
                  <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${c.color} flex items-center justify-center text-white text-lg font-bold`}>
                    {c.name.split(' ').map(n => n[0]).join('')}
                  </div>
                  <div className="flex-1">
                    <div className="font-semibold text-ink-900">{c.name}</div>
                    <div className="text-sm text-ink-500">{c.company}</div>
                    <div className="text-xs text-ink-400 font-mono mt-1">{c.email}</div>
                  </div>
                </div>
                <div className="flex items-center justify-between pt-4 border-t border-ink-100">
                  <div className="flex gap-2">
                    <span className={`px-2 py-1 rounded-lg text-xs font-medium ${c.w9 === 'collected' ? 'bg-mint-100 text-mint-700' : 'bg-gold-100 text-gold-700'}`}>W-9 {c.w9 === 'collected' ? '✓' : '●'}</span>
                    <span className={`px-2 py-1 rounded-lg text-xs font-medium ${c.tin === 'verified' ? 'bg-electric-100 text-electric-700' : 'bg-gold-100 text-gold-700'}`}>TIN {c.tin === 'verified' ? '✓' : '●'}</span>
                  </div>
                  <div className="font-mono font-semibold text-ink-900">${c.paid.toLocaleString()}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );

      const PaymentsView = () => (
        <div className="glass rounded-2xl border border-ink-200/50 overflow-hidden animate-fade-in">
          <div className="px-6 py-5 border-b border-ink-200/50 flex items-center justify-between">
            <h3 className="font-display text-xl text-ink-900">All Payments</h3>
            <button onClick={() => setPayModal(true)} className="px-5 py-2.5 bg-gradient-to-r from-electric-500 to-mint-500 text-white font-semibold rounded-xl hover:shadow-lg hover:shadow-electric-500/25 transition-all text-sm">
              + New Payment
            </button>
          </div>
          <table className="w-full">
            <thead className="bg-ink-50/50 border-b border-ink-100">
              <tr>
                <th className="px-6 py-4 text-left text-xs font-semibold text-ink-500 uppercase tracking-wider">Contractor</th>
                <th className="px-6 py-4 text-left text-xs font-semibold text-ink-500 uppercase tracking-wider">Description</th>
                <th className="px-6 py-4 text-right text-xs font-semibold text-ink-500 uppercase tracking-wider">Amount</th>
                <th className="px-6 py-4 text-center text-xs font-semibold text-ink-500 uppercase tracking-wider">Speed</th>
                <th className="px-6 py-4 text-center text-xs font-semibold text-ink-500 uppercase tracking-wider">Status</th>
                <th className="px-6 py-4 text-right text-xs font-semibold text-ink-500 uppercase tracking-wider">Date</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-ink-100">
              {payments.map(payment => {
                const c = contractors.find(x => x.id === payment.contractor);
                return (
                  <tr key={payment.id} className="hover:bg-ink-50/50 transition-colors">
                    <td className="px-6 py-4">
                      <div className="flex items-center gap-3">
                        <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${c?.color} flex items-center justify-center text-white text-xs font-bold`}>{c?.name.split(' ').map(n => n[0]).join('')}</div>
                        <span className="font-medium text-ink-900">{c?.name}</span>
                      </div>
                    </td>
                    <td className="px-6 py-4 text-ink-600">{payment.desc}</td>
                    <td className="px-6 py-4 text-right font-mono font-semibold text-ink-900">${payment.amount.toLocaleString()}</td>
                    <td className="px-6 py-4 text-center">
                      <span className={`px-3 py-1 rounded-full text-xs font-semibold ${payment.speed === 'instant' ? 'bg-electric-100 text-electric-700' : payment.speed === 'express' ? 'bg-gold-100 text-gold-700' : 'bg-ink-100 text-ink-600'}`}>
                        {payment.speed === 'instant' ? '⚡ Instant' : payment.speed === 'express' ? '→ Express' : '○ Standard'}
                      </span>
                    </td>
                    <td className="px-6 py-4 text-center">
                      <span className={`font-medium ${payment.status === 'completed' ? 'text-mint-600' : payment.status === 'processing' ? 'text-gold-600' : 'text-ink-400'}`}>
                        {payment.status === 'completed' ? '✓ Paid' : payment.status === 'processing' ? '● Processing' : '○ Scheduled'}
                      </span>
                    </td>
                    <td className="px-6 py-4 text-right text-ink-500 font-mono text-sm">{payment.date}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );

      const ComplianceView = () => (
        <div className="space-y-6 animate-fade-in">
          <div className="grid grid-cols-3 gap-4">
            {[
              { label: 'W-9s Collected', value: `${stats.w9}/${contractors.length}`, gradient: 'from-mint-400 to-mint-600' },
              { label: 'TINs Verified', value: `${contractors.filter(c => c.tin === 'verified').length}/${contractors.length}`, gradient: 'from-electric-400 to-electric-600' },
              { label: '1099s to File', value: contractors.filter(c => c.paid >= 600).length, gradient: 'from-coral-400 to-coral-600' },
            ].map((stat, i) => (
              <div key={i} className={`glass rounded-2xl p-6 border border-ink-200/50 animate-slide-up opacity-0 stagger-${i + 1}`}>
                <div className="text-xs font-semibold text-ink-500 uppercase tracking-wider mb-2">{stat.label}</div>
                <div className="font-display text-4xl text-ink-900">{stat.value}</div>
              </div>
            ))}
          </div>
          <div className="glass rounded-2xl border border-ink-200/50 overflow-hidden">
            <div className="px-6 py-5 border-b border-ink-200/50 flex items-center justify-between">
              <h3 className="font-display text-xl text-ink-900">1099 Preparation</h3>
              <button className="px-5 py-2.5 bg-gradient-to-r from-electric-500 to-mint-500 text-white font-semibold rounded-xl text-sm">Generate 1099s</button>
            </div>
            <table className="w-full">
              <thead className="bg-ink-50/50 border-b border-ink-100">
                <tr>
                  <th className="px-6 py-4 text-left text-xs font-semibold text-ink-500 uppercase">Contractor</th>
                  <th className="px-6 py-4 text-right text-xs font-semibold text-ink-500 uppercase">YTD Paid</th>
                  <th className="px-6 py-4 text-center text-xs font-semibold text-ink-500 uppercase">W-9</th>
                  <th className="px-6 py-4 text-center text-xs font-semibold text-ink-500 uppercase">TIN</th>
                  <th className="px-6 py-4 text-center text-xs font-semibold text-ink-500 uppercase">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-ink-100">
                {contractors.filter(c => c.paid >= 600).map(c => (
                  <tr key={c.id} className="hover:bg-ink-50/50">
                    <td className="px-6 py-4">
                      <div className="flex items-center gap-3">
                        <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${c.color} flex items-center justify-center text-white text-xs font-bold`}>{c.name.split(' ').map(n => n[0]).join('')}</div>
                        <div><div className="font-medium text-ink-900">{c.name}</div><div className="text-xs text-ink-400">{c.company}</div></div>
                      </div>
                    </td>
                    <td className="px-6 py-4 text-right font-mono font-semibold text-ink-900">${c.paid.toLocaleString()}</td>
                    <td className="px-6 py-4 text-center"><span className={`${c.w9 === 'collected' ? 'text-mint-600' : 'text-gold-600'}`}>{c.w9 === 'collected' ? '✓' : '●'}</span></td>
                    <td className="px-6 py-4 text-center"><span className={`${c.tin === 'verified' ? 'text-mint-600' : 'text-gold-600'}`}>{c.tin === 'verified' ? '✓' : '●'}</span></td>
                    <td className="px-6 py-4 text-center">
                      <span className={`px-3 py-1 rounded-full text-xs font-semibold ${c.w9 === 'collected' && c.tin === 'verified' ? 'bg-mint-100 text-mint-700' : 'bg-gold-100 text-gold-700'}`}>
                        {c.w9 === 'collected' && c.tin === 'verified' ? 'Ready' : 'Incomplete'}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );

      const ProjectsView = () => (
        <div className="space-y-4 animate-fade-in">
          {projects.map((project, i) => (
            <div key={project.id} className={`glass rounded-2xl border border-ink-200/50 overflow-hidden hover-lift animate-slide-up opacity-0 stagger-${i + 1}`}>
              <div className="px-6 py-5 flex items-center justify-between border-b border-ink-200/50">
                <div className="flex items-center gap-4">
                  <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${verticals[project.vertical].gradient} flex items-center justify-center text-white text-xl font-display`}>
                    {verticals[project.vertical].icon}
                  </div>
                  <div>
                    <h3 className="font-semibold text-ink-900 text-lg">{project.name}</h3>
                    <p className="text-sm text-ink-500">{project.client} · {verticals[project.vertical].name}</p>
                  </div>
                </div>
                <div className="text-right">
                  <div className="font-mono text-xl text-ink-900">${project.spent.toLocaleString()} <span className="text-ink-400 text-sm">/ ${project.budget.toLocaleString()}</span></div>
                  <div className="text-sm text-ink-500">Escrow: ${(project.funded - project.spent).toLocaleString()}</div>
                </div>
              </div>
              <div className="p-6">
                <div className="h-3 bg-ink-100 rounded-full overflow-hidden mb-4">
                  <div className={`h-full bg-gradient-to-r ${verticals[project.vertical].gradient} rounded-full`} style={{ width: `${(project.spent / project.budget) * 100}%` }} />
                </div>
                <div className="grid grid-cols-4 gap-3">
                  {project.milestones.map(m => (
                    <div key={m.id} onClick={() => m.status === 'in_progress' && setApproveModal({ project, milestone: m })} className={`p-4 rounded-xl border text-center cursor-pointer transition-all ${m.status === 'completed' ? 'bg-mint-50 border-mint-200' : m.status === 'in_progress' ? 'bg-gold-50 border-gold-200 hover:border-gold-400 hover:shadow-md' : 'bg-ink-50 border-ink-200'}`}>
                      <div className="text-sm font-medium text-ink-700 mb-1">{m.name}</div>
                      <div className="font-mono font-semibold text-ink-900">${m.amount.toLocaleString()}</div>
                      <div className="text-lg mt-1">{m.status === 'completed' ? '✓' : m.status === 'in_progress' ? '●' : '○'}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ))}
        </div>
      );

      const views = { dashboard: DashboardView, projects: ProjectsView, contractors: ContractorsView, payments: PaymentsView, compliance: ComplianceView };
      const CurrentView = views[view];

      return (
        <div className="w-full max-w-7xl mx-auto">
          <div className="glass rounded-3xl overflow-hidden border border-ink-200/50 shadow-2xl">
            <div className="flex h-[720px]">
              {/* Sidebar */}
              <div className="w-20 bg-ink-900/95 backdrop-blur-xl flex flex-col items-center py-6 border-r border-ink-800">
                <div className="w-12 h-12 bg-gradient-to-br from-electric-400 to-mint-500 rounded-2xl flex items-center justify-center mb-8 animate-glow">
                  <span className="text-white text-2xl font-display">P</span>
                </div>
                <nav className="flex flex-col items-center gap-2 flex-1">
                  {navItems.map(item => (
                    <button key={item.id} onClick={() => setView(item.id)} className={`w-12 h-12 rounded-xl flex items-center justify-center transition-all text-xl ${view === item.id ? 'bg-white/10 text-white' : 'text-ink-500 hover:text-ink-300 hover:bg-white/5'}`} title={item.label}>
                      {item.icon}
                    </button>
                  ))}
                </nav>
                <div className="w-10 h-10 rounded-full bg-gradient-to-br from-coral-400 to-coral-600 flex items-center justify-center text-white text-sm font-bold">JD</div>
              </div>

              {/* Main */}
              <div className="flex-1 flex flex-col bg-ink-50/50">
                <div className="px-8 py-6 border-b border-ink-200/50 bg-white/50 backdrop-blur-sm flex items-center justify-between">
                  <div>
                    <h1 className="font-display text-3xl text-ink-900 capitalize">{view}</h1>
                    <p className="text-ink-500">Contractor payments & compliance</p>
                  </div>
                  {view === 'dashboard' && (
                    <button onClick={() => setPayModal(true)} className="px-6 py-3 bg-gradient-to-r from-electric-500 to-mint-500 text-white font-semibold rounded-xl hover:shadow-lg hover:shadow-electric-500/25 transition-all hover:-translate-y-0.5 flex items-center gap-2">
                      <span className="text-lg">+</span> Pay Contractor
                    </button>
                  )}
                </div>
                <div className="flex-1 overflow-y-auto p-8 scrollbar-hidden">
                  <CurrentView />
                </div>
              </div>
            </div>
          </div>

          {/* Pay Modal */}
          <Modal open={payModal} onClose={() => setPayModal(false)} title="Pay Contractor">
            <form onSubmit={handlePay} className="space-y-5">
              <div>
                <label className="block text-sm font-semibold text-ink-700 mb-2">Contractor</label>
                <select value={payForm.contractor} onChange={e => setPayForm({ ...payForm, contractor: e.target.value })} required className="w-full px-4 py-3 border border-ink-200 rounded-xl focus:ring-2 focus:ring-electric-500 focus:border-transparent outline-none bg-white">
                  <option value="">Select...</option>
                  {contractors.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-sm font-semibold text-ink-700 mb-2">Amount</label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-ink-400 font-mono">$</span>
                  <input type="number" value={payForm.amount} onChange={e => setPayForm({ ...payForm, amount: e.target.value })} required min="1" className="w-full pl-8 pr-4 py-3 border border-ink-200 rounded-xl focus:ring-2 focus:ring-electric-500 outline-none font-mono" placeholder="0.00" />
                </div>
              </div>
              <div>
                <label className="block text-sm font-semibold text-ink-700 mb-2">Payout Speed</label>
                <div className="grid grid-cols-3 gap-3">
                  {[{ id: 'standard', label: 'Standard', sub: '7 days · Free' }, { id: 'express', label: 'Express', sub: '24 hrs · $24.99' }, { id: 'instant', label: 'Instant', sub: '< 30s · 2%' }].map(opt => (
                    <button key={opt.id} type="button" onClick={() => setPayForm({ ...payForm, speed: opt.id })} className={`p-4 rounded-xl border-2 transition-all text-left ${payForm.speed === opt.id ? 'border-electric-500 bg-electric-50' : 'border-ink-200 hover:border-ink-300'}`}>
                      <div className="font-semibold text-ink-900">{opt.label}</div>
                      <div className="text-xs text-ink-500">{opt.sub}</div>
                    </button>
                  ))}
                </div>
              </div>
              <div className="pt-4 flex gap-3">
                <button type="button" onClick={() => setPayModal(false)} className="flex-1 px-6 py-3 border border-ink-200 text-ink-700 rounded-xl hover:bg-ink-50 font-semibold">Cancel</button>
                <button type="submit" className="flex-1 px-6 py-3 bg-gradient-to-r from-electric-500 to-mint-500 text-white rounded-xl font-semibold hover:shadow-lg">Send</button>
              </div>
            </form>
          </Modal>

          {/* Approve Modal */}
          <Modal open={!!approveModal} onClose={() => setApproveModal(null)} title="Approve & Pay">
            {approveModal && (
              <div className="space-y-5">
                <div className="bg-ink-50 rounded-xl p-5">
                  <div className="text-ink-600 mb-1">{approveModal.milestone.name}</div>
                  <div className="font-display text-4xl text-ink-900">${approveModal.milestone.amount.toLocaleString()}</div>
                </div>
                <div className="space-y-2">
                  {[{ id: 'standard', label: 'Standard (7 days)', fee: 'Free' }, { id: 'express', label: 'Express (24 hours)', fee: '$24.99' }, { id: 'instant', label: 'Instant (< 30 sec)', fee: `$${(approveModal.milestone.amount * 0.02).toFixed(2)}` }].map(opt => (
                    <button key={opt.id} onClick={() => handleApprove(opt.id)} className="w-full p-5 rounded-xl border-2 border-ink-200 hover:border-electric-500 hover:bg-electric-50 transition-all flex items-center justify-between">
                      <span className="font-semibold text-ink-900">{opt.label}</span>
                      <span className="font-mono text-ink-600">{opt.fee}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
          </Modal>

          {/* Toasts */}
          <div className="fixed bottom-6 right-6 space-y-3 z-50">
            {toasts.map(t => <Toast key={t.id} msg={t.msg} onClose={() => setToasts(prev => prev.filter(x => x.id !== t.id))} />)}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<PayoutDashboard />);
  </script>
</body>
</html>
